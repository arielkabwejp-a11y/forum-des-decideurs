    :root {
      --bleu-nuit: #0a2a66;
      --bleu: #1e6bff;

      --gris-fond: #f5f8ff;

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, Helvetica, sans-serif; color: var(--texte); background: var(--blanc); line-height: 1.6; }

    @keyframes apparaitre { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }

    #visionneuse img { max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; border-radius: 8px; }
    #fermer { position: absolute; top: 12px; right: 18px; background: none; color: var(--blanc); font-size: 44px; line-height: 1; border: none; cursor: pointer; padding: 0 8px; }
    #fermer:hover { background: none; color: #9cc4ff; }

    /* Barre supérieure */
    .topbar { background: var(--bleu-nuit); color: var(--blanc); font-size: 14px; padding: 8px 20px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }

    /* En-tête */
    header { background: var(--blanc); padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; position: sticky; top: 0; box-shadow: 0 2px 10px rgba(10,42,102,0.12); z-index: 10; }
    header img { height: 80px; width: auto; }
    nav { display: flex; flex-wrap: wrap; gap: 6px 18px; }
    nav a { color: var(--texte); text-decoration: none; font-weight: bold; font-size: 15px; padding: 4px 0; }
    nav a:hover { color: var(--bleu); }
    .btn-haut { background: var(--bleu); color: var(--blanc); padding: 10px 20px; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 15px; }

    /* Bannière */
    .hero { background: linear-gradient(90deg, rgba(10,42,102,0.92) 40%, rgba(10,42,102,0.55)), url('photo-7.jpg') center/cover; color: var(--blanc); padding: 110px 20px; }
    .hero-contenu { max-width: 1100px; margin: auto; }
    .tag { display: inline-block; background: rgba(255,255,255,0.15); padding: 6px 14px; border-radius: 20px; font-size: 14px; margin-bottom: 18px; }
    .hero h1 { font-size: 50px; line-height: 1.15; margin-bottom: 18px; max-width: 700px; }
    .hero h1 span { color: #9cc4ff; }
    .hero p { font-size: 19px; max-width: 620px; margin-bottom: 32px; }
    .boutons { display: flex; gap: 14px; flex-wrap: wrap; }
    .bouton { display: inline-block; padding: 14px 30px; border-radius: 6px; text-decoration: none; font-weight: bold; }
    .bouton-plein { background: var(--bleu); color: var(--blanc); }
    .bouton-plein:hover { background: #1557d6; }
    .bouton-clair { background: var(--blanc); color: var(--bleu-nuit); }
    .bouton-clair:hover { background: var(--bleu-clair); }

    /* Sections générales */
    section { padding: 80px 20px; max-width: 1100px; margin: auto; }
    .titre { font-size: 38px; color: var(--bleu-nuit); text-align: center; margin-bottom: 12px; }

    .sous-titre { text-align: center; color: var(--gris); max-width: 680px; margin: 0 auto 45px; }

    .carte h3 { color: var(--bleu-nuit); font-size: 19px; margin-bottom: 8px; }
    .carte p { color: var(--gris); }
